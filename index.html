  <pre>
    Active Learning (Angluin, 1988, Cohn et al., 1994) is a paradigm where a concept is learnt by an
intelligent machine through the interaction of an oracle with the machine system, over a sequence of
learning epochs. A distinctive component in an active system is the querying strategy, used to sample
candidate training instances from a pool and evaluate them for informativeness, i.e., their potential
to improve the classification model. Various strategies have been proposed including; Query by
Committee (Seung et al., 1992), Monte Carlo estimation (Roy and McCallum, 2001), uncertainty
sampling (Lewis and Gale, 1994) and version space reduction (margin sampling) (Tong and Koller,
2001). Irrespective of how the most informative pattern instances are chosen at each epoch they are
presented for labeling, to a machine (database) or human oracle that has knowledge of the class
labels. After adding the newly labeled instances to the current training set, a revised model is
subsequently induced. A goal of this process is to achieve an efficient, incremental advancement of
learning at each epoch. The process is continued until some stopping criterion has been met, such as
reaching a stage where information from the selected instances is contrary to the model, causing the
classifier confidence to drop, as in Vlachos (2008)

 <!-- 3D ASCII Cube JavaScript Engine -->
        <script>
        (function () {
          let A = 0, B = 0, C = 0;
          const width = 56, height = 36; // Expanded grid width & height to prevent clipping
          const zBuffer = new Array(width * height);
          const buffer = new Array(width * height);
          const backgroundASCIICode = ' ';
          const distanceFromCam = 100;
          const K1 = 40;
          const cubeWidth = 20;

          function calculateX(i, j, k) {
            return j * Math.sin(A) * Math.sin(B) * Math.cos(C) - k * Math.cos(A) * Math.sin(B) * Math.cos(C) +
                   j * Math.cos(A) * Math.sin(C) + k * Math.sin(A) * Math.sin(C) + i * Math.cos(B) * Math.cos(C);
          }

          function calculateY(i, j, k) {
            return j * Math.cos(A) * Math.cos(C) + k * Math.sin(A) * Math.cos(C) -
                   j * Math.sin(A) * Math.sin(B) * Math.sin(C) + k * Math.cos(A) * Math.sin(B) * Math.sin(C) -
                   i * Math.cos(B) * Math.sin(C);
          }

          function calculateZ(i, j, k) {
            return k * Math.cos(A) * Math.cos(B) - j * Math.sin(A) * Math.cos(B) + i * Math.sin(B) + distanceFromCam;
          }

          function calculateForSurface(cubeX, cubeY, cubeZ, ch) {
            let x = calculateX(cubeX, cubeY, cubeZ);
            let y = calculateY(cubeX, cubeY, cubeZ);
            let z = calculateZ(cubeX, cubeY, cubeZ);

            let ooz = 1 / z;
            let xp = Math.floor(width / 2 + K1 * ooz * x * 2);
            let yp = Math.floor(height / 2 + K1 * ooz * y);

            let idx = xp + yp * width;
            if (idx >= 0 && idx < width * height) {
              if (ooz > zBuffer[idx]) {
                zBuffer[idx] = ooz;
                buffer[idx] = ch;
              }
            }
          }

          function renderFrame() {
            buffer.fill(backgroundASCIICode);
            zBuffer.fill(0);

            let incrementSpeed = 1.2;
            for (let cubeX = -cubeWidth; cubeX < cubeWidth; cubeX += incrementSpeed) {
              for (let cubeY = -cubeWidth; cubeY < cubeWidth; cubeY += incrementSpeed) {
                calculateForSurface(cubeX, cubeY, -cubeWidth, '@');
                calculateForSurface(cubeWidth, cubeY, cubeX, '$');
                calculateForSurface(-cubeWidth, cubeY, -cubeX, '~');
                calculateForSurface(-cubeX, cubeY, cubeWidth, '#');
                calculateForSurface(cubeX, -cubeWidth, -cubeY, ';');
                calculateForSurface(cubeX, cubeWidth, cubeY, '+');
              }
            }

            let output = '';
            for (let i = 0; i < buffer.length; i++) {
              output += i % width === 0 && i !== 0 ? '\n' + buffer[i] : buffer[i];
            }

            const elem = document.getElementById('ascii-cube');
            if (elem) elem.textContent = output;

            A += 0.04;
            B += 0.04;
            C += 0.01;
          }

          setInterval(renderFrame, 30);
        })();
        </script>
